[project]
name = "teamspeak-spy"
version = "0.1.0"
description = "Poll a TeamSpeak 5 server and update a Discord webhook message with the online user count"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "JorgeDM02", email = "jdominguezmoreira@gmail.com" }
]
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.scripts]
teamspeak-spy = "teamspeak_spy.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
